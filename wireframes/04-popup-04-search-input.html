<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>WF - 04 검색 (입력 중)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', 'Noto Sans KR', -apple-system, sans-serif; }
:root {
  --line: #BDBDBD;
  --line-light: #E0E0E0;
  --fill: #EEEEEE;
  --fill-mid: #D6D6D6;
  --fill-dark: #9E9E9E;
  --text: #424242;
  --text-2: #757575;
  --text-3: #9E9E9E;
  --accent: #6B6B6B;
}
body {
  width: 1920px;
  min-height: 1080px;
  background: rgba(60,60,60,0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: var(--text);
}
.popup {
  background: #FFFFFF;
  border: 1px dashed var(--line);
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  padding: 24px 28px;
}
.popup-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.popup-title { font-size: 18px; font-weight: 700; }
.popup-meta { font-size: 12px; color: var(--text-2); margin-left: 12px; font-weight: 400; }
.popup-header-left { display: flex; align-items: baseline; }
.popup-close {
  width: 24px; height: 24px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-2);
  border: 1px dashed var(--line);
  border-radius: 4px;
}
.icon-x {
  display: inline-block;
  position: relative;
  width: 12px; height: 12px;
}
.icon-x::before, .icon-x::after {
  content: ''; position: absolute; left: 50%; top: 50%;
  width: 14px; height: 1.4px; background: currentColor;
}
.icon-x::before { transform: translate(-50%, -50%) rotate(45deg); }
.icon-x::after { transform: translate(-50%, -50%) rotate(-45deg); }

/* Popup body */
.popup-body { font-size: 14px; }

/* Search input */
.search-row { display: flex; gap: 8px; margin-bottom: 20px; }
.search-input {
  flex: 1;
  height: 40px;
  padding: 0 14px;
  border: 1px dashed var(--line);
  border-radius: 6px;
  background: #FFF;
  font-size: 14px;
  color: var(--text-3);
  display: flex; align-items: center;
}
.search-btn {
  width: 64px; height: 40px;
  background: var(--fill-mid);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text);
  font-weight: 600;
}

/* Search history */
.search-section-title { font-size: 13px; font-weight: 600; margin: 16px 0 8px; color: var(--text); }
.search-history-list { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--text-2); }
.search-result-list { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--text-2); margin-top: 8px; }

/* No result */
.empty-state { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 28px 0 8px; color: var(--text-2); font-size: 13px; text-align: center; }
.empty-icon { width: 36px; height: 36px; color: var(--text-3); }
.ic { width: 16px; height: 16px; display: block; }

/* Tables (common) */
.popup-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.popup-table th, .popup-table td { padding: 12px 8px; border-bottom: 1px solid var(--line-light); text-align: center; }
.popup-table thead th { background: var(--fill); border-top: 1px solid var(--line); font-weight: 600; }
.popup-table td.left { text-align: left; }
.popup-table td.right { text-align: right; }

/* Pagination */
.pagination {
  display: flex; align-items: center; justify-content: center;
  gap: 4px;
  margin-top: 16px;
  font-size: 13px;
}
.page-num {
  width: 28px; height: 28px;
  display: inline-flex;
  align-items: center; justify-content: center;
  color: var(--text-2);
  border-radius: 4px;
}
.page-num.active { background: var(--fill-mid); color: var(--text); font-weight: 600; }
.page-arrow {
  width: 28px; height: 28px;
  display: inline-flex;
  align-items: center; justify-content: center;
  color: var(--text-2);
  border: 1px dashed var(--line);
  border-radius: 4px;
}
.chev { display: inline-block; width: 6px; height: 6px; border: solid currentColor; border-width: 0 1.4px 1.4px 0; }
.chev-r { transform: rotate(-45deg); }
.chev-l { transform: rotate(135deg); }

/* Detail header */
.detail-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; padding-bottom: 12px; border-bottom: 1px solid var(--line-light); }
.detail-date { font-size: 12px; color: var(--text-2); margin-bottom: 12px; }
.detail-body { font-size: 13px; line-height: 1.7; color: var(--text); padding: 12px 0; min-height: 120px; }
.btn-bar { display: flex; justify-content: center; margin-top: 16px; }
.btn-primary {
  height: 38px;
  padding: 0 32px;
  background: var(--fill-mid);
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}

/* Notification */
.notif-list { display: flex; flex-direction: column; }
.notif-item { padding: 14px 4px; border-bottom: 1px solid var(--line-light); }
.notif-tag {
  display: inline-block;
  padding: 2px 8px;
  border: 1px dashed var(--line);
  border-radius: 10px;
  font-size: 11px;
  color: var(--text-2);
  margin-bottom: 6px;
}
.notif-text { font-size: 13px; color: var(--text); line-height: 1.5; margin-bottom: 4px; }
.notif-date { font-size: 11px; color: var(--text-3); }

/* FAQ detail */
.faq-q { font-size: 14px; font-weight: 700; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line-light); }
.faq-a { font-size: 13px; line-height: 1.7; color: var(--text-2); padding: 12px 0; min-height: 140px; }

</style>
</head>
<body>
<div class="popup" style="width: 460px;">
  <div class="popup-header">
    <div class="popup-header-left"><div class="popup-title">검색</div></div>
    <div class="popup-close"><span class="icon-x"></span></div>
  </div>
  <div class="popup-body">
    <div class="search-row">
      <div class="search-input" style="color:var(--text);">검색어 입력 예시</div>
      <div class="search-btn">검색</div>
    </div>
    <div class="search-section-title">검색</div>
    <div class="search-history-list">
      <div>결재 &gt; 결재함 &gt; 결재대기</div>
      <div>대금지급 &gt; 등록조회</div>
    </div>
  </div>
</div>
</body>
</html>
